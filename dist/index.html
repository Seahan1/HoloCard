<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="在浏览器本地预览 PSD 卡牌的彩虹镭射、银箔与金箔效果。">
  <title>HoloCard · PSD 卡牌预览</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/ag-psd.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="skip-link" href="#workspace">跳到工作台</a>
    <a class="brand" href="#workspace" aria-label="HoloCard 工作台">
      <strong>HoloCard</strong>
      <span>卡牌材质工作台</span>
    </a>

    <div class="topbar-actions">
      <input id="psdInput" class="visually-hidden" type="file" accept=".psd,image/vnd.adobe.photoshop">
      <label class="primary-button" for="psdInput">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4.5 4.5M12 3 7.5 7.5M5 13v6h14v-6"/></svg>
        导入 PSD
      </label>
    </div>
  </header>

  <main id="workspace" class="workspace" tabindex="-1" aria-label="卡牌材质工作台">
    <aside class="panel layers-panel" aria-labelledby="layersTitle">
      <div class="panel-heading">
        <h2 id="layersTitle">图层</h2>
        <span id="layerCount" class="count-badge">4</span>
      </div>

      <div class="document-summary">
        <div class="document-icon" aria-hidden="true"></div>
        <div>
          <strong id="documentName">示例卡牌.psd</strong>
          <span id="documentMeta">750 × 1050 px</span>
        </div>
      </div>

      <div id="layerList" class="layer-list" role="listbox" aria-label="PSD 图层"></div>

      <div class="panel-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5m0 3.5v.1M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Z"/></svg>
        <p>特效适用于普通像素图层。请先在 Photoshop 中栅格化蒙版、调整层和图层样式。</p>
      </div>
    </aside>

    <section id="previewStage" class="preview-stage" aria-labelledby="previewTitle">
      <div class="stage-heading">
        <div class="preview-heading">
          <h1 id="previewTitle">卡牌预览</h1>
          <span id="statusPill" class="preview-status"><span aria-hidden="true"></span>示例卡牌</span>
        </div>
        <fieldset class="preview-background">
          <legend>背景</legend>
          <label class="background-option">
            <input class="visually-hidden" type="radio" name="preview-background" value="white" checked>
            <span>白色</span>
          </label>
          <label class="background-option">
            <input class="visually-hidden" type="radio" name="preview-background" value="transparent">
            <span>透明</span>
          </label>
        </fieldset>
      </div>

      <div id="dropZone" class="card-scene">
        <div id="tiltShell" class="card-shell" tabindex="0" role="img" aria-label="可拖动或用方向键旋转的卡牌预览">
          <div id="cardRotator" class="card-rotator">
            <div id="card" class="card card-front" data-background="white">
              <div id="cardContent" class="card-content"></div>
            </div>
            <div class="card card-back" aria-hidden="true"></div>
          </div>
        </div>

        <div id="dropPrompt" class="drop-prompt" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 4v10m0-10 4 4m-4-4L8 8M5 14v5h14v-5"/></svg>
          <strong>松开以读取 PSD</strong>
        </div>
      </div>

      <div class="preview-toolbar">
        <p class="drag-tip">拖动卡牌查看反光或翻面</p>
        <div class="angle-readout" aria-label="当前卡牌角度">
          <span>X <strong id="angleX">0°</strong></span>
          <span>Y <strong id="angleY">0°</strong></span>
        </div>
        <button id="resetTilt" class="ghost-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8V4m0 0h4M5 4l3.2 3.2A7 7 0 1 1 5.6 15"/></svg>
          重置角度
        </button>
      </div>
    </section>

    <aside class="panel effects-panel" aria-labelledby="effectsTitle">
      <div class="panel-heading">
        <h2 id="effectsTitle">材质</h2>
      </div>

      <div class="selected-layer-card">
        <span>作用图层</span>
        <strong id="selectedLayerName">镭射徽记</strong>
      </div>

      <fieldset class="effect-picker">
        <legend class="visually-hidden">材质类型</legend>
        <button class="effect-option is-active" type="button" data-effect="rainbow" aria-pressed="true">
          <span class="effect-swatch swatch-rainbow" aria-hidden="true"></span>
          <strong>彩虹镭射</strong>
        </button>
        <button class="effect-option" type="button" data-effect="silver" aria-pressed="false">
          <span class="effect-swatch swatch-silver" aria-hidden="true"></span>
          <strong>银箔</strong>
        </button>
        <button class="effect-option" type="button" data-effect="gold" aria-pressed="false">
          <span class="effect-swatch swatch-gold" aria-hidden="true"></span>
          <strong>金箔</strong>
        </button>
        <button class="effect-option" type="button" data-effect="silver-glitter" aria-pressed="false">
          <span class="effect-swatch effect-silver-glitter" aria-hidden="true"></span>
          <strong>银葱</strong>
        </button>
        <button class="effect-option" type="button" data-effect="gold-glitter" aria-pressed="false">
          <span class="effect-swatch effect-gold-glitter" aria-hidden="true"></span>
          <strong>金葱</strong>
        </button>
        <button class="effect-option" type="button" data-effect="iridescent-brush" aria-pressed="false">
          <span class="effect-swatch effect-iridescent-brush" aria-hidden="true"></span>
          <strong>幻彩拉丝</strong>
        </button>
        <button class="effect-option" type="button" data-effect="cross-holo" aria-pressed="false">
          <span class="effect-swatch effect-cross-holo" aria-hidden="true"></span>
          <strong>十字镭射</strong>
        </button>
        <button class="effect-option" type="button" data-effect="flake-holo" aria-pressed="false">
          <span class="effect-swatch effect-flake-holo" aria-hidden="true"></span>
          <strong>碎花镭射</strong>
        </button>
      </fieldset>

      <div class="intensity-control">
        <div class="control-label">
          <label for="intensity">特效强度</label>
          <output id="intensityValue" for="intensity">68%</output>
        </div>
        <input id="intensity" type="range" min="0" max="100" value="68">
      </div>

      <div class="security-card">
        <div class="security-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 5.5 5.6v5.2c0 4.1 2.6 7.8 6.5 9.2 3.9-1.4 6.5-5.1 6.5-9.2V5.6L12 3Zm-3 8.5 2 2 4-4"/></svg>
        </div>
        <p>PSD 仅在此浏览器中处理。</p>
      </div>

      <div id="parserMessage" class="parser-message" role="status" aria-live="polite">
        <p></p>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
</body>
</html>
